<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>旅程</title>
  <meta name="description" content="義大利 × 南法蔚藍海岸 15 日熟齡慢活旅程。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="icon" href="favicon.ico">
  <style>
    :root {
      --bg: #faf9f5;
      --fg: #273447;
      --card: #fff;
      --primary: #244b67;
      --secondary: #eef2f4;
      --muted: #697582;
      --border: #dce2e6;
      --accent: #d6a34a;
      --shadow: 0 10px 30px rgba(39, 52, 71, .08)
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Noto Sans TC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased
    }

    h1,
    h2,
    h3 {
      font-family: "Noto Serif TC", "Songti TC", serif;
      letter-spacing: .01em;
      margin: 0
    }

    a {
      color: inherit;
      text-decoration: none
    }

    img {
      display: block;
      max-width: 100%
    }

    .wrap {
      max-width: 1152px;
      margin: auto;
      padding: 0 20px
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .muted {
      color: var(--muted)
    }

    section {
      scroll-margin-top: 70px
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(250, 249, 245, .9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(220, 226, 230, .8)
    }

    .nav {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      white-space: nowrap
    }

    .brand strong {
      font-family: "Noto Serif TC";
      font-size: 19px
    }

    .brand small {
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted)
    }

    nav {
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: var(--muted)
    }

    nav a:hover {
      color: var(--fg)
    }

    .pill {
      background: var(--primary);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px
    }

    .hero {
      position: relative;
      height: 68vh;
      min-height: 440px;
      overflow: hidden
    }

    .hero>img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .hero:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(23, 56, 79, .88), rgba(23, 56, 79, .25), transparent)
    }

    .hero-copy {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: 42px;
      transform: translateX(-50%);
      width: 100%;
      color: white
    }

    .hero-copy .eyebrow {
      color: rgba(255, 255, 255, .72)
    }

    .hero h1 {
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.18;
      margin-top: 12px;
      max-width: 820px
    }

    .hero p {
      max-width: 700px;
      margin: 14px 0 0;
      color: rgba(255, 255, 255, .86)
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--border);
      gap: 1px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      margin-top: -30px;
      z-index: 3
    }

    .fact {
      background: var(--card);
      padding: 18px 20px
    }

    .fact .value {
      font-family: "Noto Serif TC";
      font-size: 18px;
      margin-top: 4px
    }

    section.pad {
      padding: 64px 0
    }

    .section-title {
      max-width: 760px;
      margin-bottom: 30px
    }

    .section-title h2 {
      font-size: 30px;
      margin-top: 8px
    }

    .section-title p {
      font-size: 14px;
      line-height: 1.9;
      margin: 12px 0 0;
      color: var(--muted)
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px
    }

    .stat,
    .card,
    .day {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow)
    }

    .stat {
      padding: 20px
    }

    .stat b {
      font-family: "Noto Serif TC";
      font-size: 26px;
      color: var(--accent)
    }

    .stat p {
      font-size: 12px;
      line-height: 1.7;
      color: var(--muted);
      margin: 8px 0 0
    }

    .principle {
      background: var(--primary);
      color: white
    }

    .principle-grid {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 50px;
      align-items: center
    }

    .principle .eyebrow {
      color: rgba(255, 255, 255, .6)
    }

    .principle-map {
      margin: 16px 0 0;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .28);
      border: 1px solid rgba(214, 163, 74, .4);
      background: #132230
    }

    .principle-map img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 13px;
      transition: transform .4s ease
    }

    .principle-map:hover img {
      transform: scale(1.015)
    }

    .route {
      border-left: 1px solid rgba(255, 255, 255, .22);
      padding-left: 24px;
      margin: 0;
      list-style: none
    }

    .route li {
      position: relative;
      margin-bottom: 20px
    }

    .route li:before {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      left: -29px;
      top: 8px
    }

    .route strong {
      font-family: "Noto Serif TC";
      font-size: 18px
    }

    .route span {
      display: block;
      font-size: 13px;
      color: rgba(255, 255, 255, .68);
      margin-top: 3px
    }

    .grid2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px
    }

    .card-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border)
    }

    .card-head h3 {
      font-size: 19px;
      margin-top: 4px
    }

    .rows>div {
      display: grid;
      grid-template-columns: 6rem 1fr;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border)
    }

    .rows>div:last-child {
      border-bottom: 0
    }

    .rows dt {
      font-size: 12px;
      color: var(--muted)
    }

    .rows dd {
      margin: 0;
      font-size: 13px;
      line-height: 1.7
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 14px
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      min-width: 900px
    }

    th,
    td {
      padding: 11px 12px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
      line-height: 1.65
    }

    th {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap
    }

    tbody tr:hover {
      background: var(--secondary)
    }

    .alt {
      background: rgba(238, 242, 244, .65)
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px
    }

    .photo-card {
      overflow: hidden;
      border-radius: 12px;
      background: white;
      box-shadow: var(--shadow)
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      transition: transform .5s
    }

    .photo-card:hover img {
      transform: scale(1.03)
    }

    .photo-card figcaption {
      padding: 16px 18px
    }

    .photo-card h3 {
      font-size: 16px;
      margin-top: 4px
    }

    .photo-card p {
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
      margin: 4px 0 0
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px 42px
    }

    .food-item {
      border-left: 2px solid rgba(214, 163, 74, .55);
      padding-left: 15px
    }

    .food-item h3 {
      font-size: 16px;
      margin-top: 4px
    }

    .food-item p {
      font-size: 13px;
      line-height: 1.75;
      color: var(--muted);
      margin: 4px 0 0
    }

    .hotel-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px
    }

    .hotel {
      overflow: hidden
    }

    .hotel img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover
    }

    .hotel-body {
      padding: 18px
    }

    .hotel-body h3 {
      font-size: 19px;
      margin-top: 5px
    }

    .hotel-body p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.75
    }

    .days {
      display: grid;
      gap: 34px;
      padding: 0;
      margin: 0;
      list-style: none
    }

    .day {
      overflow: hidden
    }

    .day-cover {
      position: relative;
      margin: 0
    }

    .day-cover img {
      width: 100%;
      aspect-ratio: 21/9;
      object-fit: cover
    }

    .day-cover:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(20, 32, 43, .85), transparent 70%)
    }

    .day-caption {
      position: absolute;
      z-index: 1;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 25px;
      color: white
    }

    .day-no {
      font-family: "Noto Serif TC";
      font-size: 32px
    }

    .day-date {
      font-size: 13px;
      opacity: .8;
      margin-left: 10px
    }

    .day-title {
      font-size: 22px;
      margin-top: 7px;
      max-width: 850px
    }

    .day-caption small {
      opacity: .75
    }

    .day-body {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 30px;
      padding: 28px
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 18px
    }

    .tag {
      border: 1px solid var(--border);
      background: var(--secondary);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      color: #485866
    }

    .items {
      margin: 0;
      padding: 0;
      list-style: none
    }

    .items li {
      display: flex;
      gap: 11px;
      font-size: 13px;
      line-height: 1.8;
      margin: 9px 0
    }

    .items li:before {
      content: "";
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 8px
    }

    .meta {
      border-top: 1px solid var(--border);
      margin-top: 20px;
      padding-top: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 12px
    }

    .meta b {
      font-weight: 400;
      color: var(--muted);
      margin-right: 6px
    }

    .day-gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      align-content: start
    }

    .day-gallery img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 10px
    }

    .day-gallery figcaption {
      padding: 7px 2px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted)
    }

    .notes {
      background: var(--secondary)
    }

    .notes ul {
      padding: 0;
      margin: 0;
      list-style: none
    }

    .notes li {
      font-size: 13px;
      line-height: 1.8;
      margin: 10px 0;
      display: flex;
      gap: 10px
    }

    .notes li:before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 8px;
      flex: none
    }

    .contact {
      background: var(--primary);
      color: white;
      border-radius: 18px;
      padding: 44px 48px
    }

    .contact p {
      color: rgba(255, 255, 255, .8);
      max-width: 650px;
      line-height: 1.8
    }

    .contact-info {
      display: flex;
      flex-wrap: wrap;
      gap: 35px;
      margin-top: 26px
    }

    .contact-info small {
      display: block;
      color: rgba(255, 255, 255, .55);
      letter-spacing: .2em
    }

    .contact-info strong {
      font-family: "Noto Serif TC";
      font-size: 17px;
      display: block;
      margin-top: 3px
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 28px 0;
      font-size: 11px;
      color: var(--muted)
    }

    .footer-flex {
      display: flex;
      justify-content: space-between;
      gap: 15px
    }

    @media(max-width:900px) {
      nav {
        display: none
      }

      .stats {
        grid-template-columns: repeat(2, 1fr)
      }

      .photo-grid,
      .hotel-grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .principle-grid,
      .day-body {
        grid-template-columns: 1fr
      }

      .facts {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:600px) {
      .hero {
        height: 62vh;
        min-height: 430px
      }

      .hero-copy {
        bottom: 30px
      }

      .hero h1 {
        font-size: 32px
      }

      .hero p {
        font-size: 13px
      }

      section.pad {
        padding: 48px 0
      }

      .section-title h2 {
        font-size: 25px
      }

      .grid2,
      .food-grid,
      .photo-grid,
      .hotel-grid {
        grid-template-columns: 1fr
      }

      .stats {
        grid-template-columns: 1fr 1fr
      }

      .facts {
        grid-template-columns: 1fr 1fr
      }

      .day-caption {
        padding: 18px
      }

      .day-no {
        font-size: 27px
      }

      .day-title {
        font-size: 18px
      }

      .day-body {
        padding: 20px
      }

      .meta {
        grid-template-columns: 1fr
      }

      .day-gallery {
        grid-template-columns: 1fr 1fr
      }

      .contact {
        padding: 32px 24px
      }

      .footer-flex {
        flex-direction: column
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap nav">
      <div class="brand"><strong id="brand"></strong><small id="code"></small></div>
      <nav id="nav"></nav><a class="pill" href="#itinerary">查看每日行程</a>
    </div>
  </header>
  <section class="hero"><img id="hero-img">
    <div class="wrap hero-copy">
      <div class="eyebrow" id="hero-code"></div>
      <h1 id="hero-title"></h1>
      <p id="hero-subtitle"></p>
    </div>
  </section>
  <div class="wrap">
    <dl class="facts" id="facts"></dl>
  </div>
  <main>
    <section id="overview" class="pad wrap">
      <div class="section-title" id="overview-title"></div>
      <div class="stats" id="stats"></div>
    </section>
    <section id="principle" class="pad principle">
      <div class="wrap principle-grid">
        <div>
          <div class="eyebrow" id="principle-eye"></div>
          <figure class="principle-map"><img id="principle-map-img" loading="lazy"></figure>
        </div>
        <ol class="route" id="route"></ol>
      </div>
    </section>
    <section id="transport" class="pad wrap">
      <div class="section-title" id="transport-title"></div>
      <div class="grid2" id="flight-cards"></div>
      <h3 style="margin-top:48px">旅行通票與城市卡明細　Passes & City Cards</h3>
      <div class="table-wrap">
        <table id="passes"></table>
      </div>
      <h3 style="margin-top:48px">義大利鐵路與機場快線時刻總表</h3>
      <div class="table-wrap">
        <table id="rails"></table>
      </div>
    </section>
    <section id="destinations" class="pad alt">
      <div class="wrap">
        <div class="section-title" id="dest-title"></div>
        <div class="photo-grid" id="dest-grid"></div>
      </div>
    </section>
    <section id="food" class="pad wrap">
      <div class="section-title" id="food-title"></div>
      <div class="food-grid" id="food-grid"></div>
    </section>
    <section id="hotels" class="pad alt">
      <div class="wrap">
        <div class="section-title" id="hotel-title"></div>
        <div class="hotel-grid" id="hotel-grid"></div>
      </div>
    </section>
    <section id="itinerary" class="pad wrap">
      <div class="section-title" id="itinerary-title"></div>
      <ol class="days" id="days"></ol>
    </section>
    <section id="notes" class="pad notes">
      <div class="wrap">
        <div class="section-title">
          <div class="eyebrow">NOTICE</div>
          <h2>行程彈性說明</h2>
        </div>
        <ul id="notes"></ul>
      </div>
    </section>
    <section id="contact" class="pad wrap">
      <div class="contact">
        <h2 id="contact-title"></h2>
        <p id="contact-text"></p>
        <div class="contact-info" id="contact-info"></div>
      </div>
    </section>
  </main>
  <footer>
    <div class="wrap footer-flex"><span id="footer-left"></span><span id="footer-right"></span></div>
  </footer>
  <script>
    // 📸 圖片設定區 (41 個專屬獨立圖檔，完全無共用圖片)
    const IMAGE = {
      // 頂部主視覺 (Hero)
      hero: "hero.jpg",
      // 行程路線地圖 (Route Map)
      routeMap: "rmap.jpeg",

      // 6 大精選景點 (Destinations)
      destMilano: "milano.jpg",
      destBergamo: "bergamo.jpg",
      destComo: "como.jpg",
      destGenova: "genova.jpg",
      destCapferrat: "capferrat.jpg",
      destNice: "dest-nice.jpg",

      // 3 大精選停留飯店 (Hotels)
      hotelMilan: "hotel-milan.jpg",
      hotelGenova: "hotel-genova.jpg",
      hotelNice: "hotel-nice.jpg",

      // 每日行程相簿 (Itinerary Gallery - 31 張完全獨立專屬圖檔)
      day01Flight: "day01-flight.jpg",
      day01Milano: "day01-milano.jpg",
      day02Malpensa: "day02-malpensa-express.jpg",
      day02Navigli: "navigli.jpg",
      day02DuomoTeaser: "day02-duomo-teaser.jpg",
      day03DuomoRoof: "duomo-roof.jpg",
      day03Galleria: "day03-galleria.jpg",
      day03NavigliSunset: "day03-navigli-sunset.jpg",
      day04BergamoFunicular: "day04-bergamo-funicular.jpg",
      day04MilanReturn: "day04-milan-return.jpg",
      day05VarennaLake: "day05-varenna-lake.jpg",
      day05Bellagio: "bellagio.jpg",
      day06GenovaStation: "day06-genova-station.jpg",
      day06GenovaPort: "genova-port.jpg",
      day07PalazziRolli: "day07-palazzi-rolli.jpg",
      day07PortoAnticoCafe: "day07-porto-antico-cafe.jpg",
      day08Portofino: "portofino.jpg",
      day08SantaMargherita: "day08-santa-margherita.jpg",
      day09Ventimiglia: "ventimiglia.jpg",
      day09NiceStation: "day09-nice-station.jpg",
      day09NiceHotelSunset: "day09-nice-hotel-sunset.jpg",
      day10CoursSaleya: "nice-oldtown.jpg",
      day10PromenadeCafe: "day10-promenade-cafe.jpg",
      day10BaieDesAnges: "day10-baie-des-anges.jpg",
      day11Villefranche: "villefranche.jpg",
      day11NiceFree: "day11-nice-free.jpg",
      day12VillaRothschild: "day12-villa-rothschild.jpg",
      day12CapferratCoast: "day12-capferrat-coast.jpg",
      day13Promenade: "nice-promenade.jpg",
      day13NiceShopping: "day13-nice-shopping.jpg",
      day14NiceDeparture: "day14-nice-departure.jpg"
    };
















    /**
     * 這是整個導覽頁唯一的內容來源。
     * 想換文字、圖片、天數、日期、車次、飯店，全部在這個檔案修改即可。
     * 新增一天 = 在 itinerary 陣列裡多加一個物件；刪除一天 = 移除物件。
     */

    const tour = {
      brand: "TRAVEL EURO",
      code: "SENIOR SLOW TRAVEL 2025",
      title: "義大利 × 南法蔚藍海岸 15 日",
      subtitle: "一場關於水、光與慢時間的骨架計畫（10/15–10/29）",
      heroImage: IMAGE.hero,
      heroAlt: "尼斯天使灣與英國人散步大道的海岸風景",
      departDate: "10 / 15（四）",
      returnDate: "10 / 29（四）",
      days: 15,
      nights: 12,

    function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
    function placeholderSvg(title, category, aspect) {
      const w = 800, h = (aspect === '21/9') ? 343 : (aspect === '16/9') ? 450 : 600;
      const safeTitle = esc(title || '景點實景照片');
      const safeCat = esc(category || 'PHOTO');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="100%" height="100%">
    <defs>
      <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1b364b"/>
        <stop offset="100%" stop-color="#244b67"/>
      </linearGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#g)"/>
    <rect x="16" y="16" width="${w - 32}" height="${h - 32}" fill="none" stroke="#d6a34a" stroke-width="1.2" stroke-opacity="0.45" rx="10"/>
    <text x="50%" y="${Math.round(h * 0.38)}" text-anchor="middle" fill="#d6a34a" font-family="'Noto Sans TC',sans-serif" font-size="14" letter-spacing="3" font-weight="600">${safeCat}</text>
    <text x="50%" y="${Math.round(h * 0.52)}" text-anchor="middle" fill="#ffffff" font-family="'Noto Serif TC',serif" font-size="${w > 600 ? 22 : 18}" font-weight="600">${safeTitle}</text>
    <text x="50%" y="${Math.round(h * 0.64)}" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="'Noto Sans TC',sans-serif" font-size="12" letter-spacing="1">專屬實景照片 · ${aspect || '4:3'}</text>
  </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }
    function imgSrc(v, title, category, aspect) { return (typeof v === "string" && v.trim()) ? v : placeholderSvg(title, category, aspect) }
    function sectionTitle(o) { return `<div class="eyebrow">${esc(o.eyebrow)}</div>${o.title ? `<h2>${esc(o.title)}</h2>` : ""}${o.text ? `<p>${esc(o.text)}</p>` : ""}` }
    document.title = `${tour.title}｜${tour.departDate} 出發`;
    brand.textContent = tour.brand; code.textContent = tour.code;

    const heroImg = document.getElementById("hero-img");
    heroImg.src = imgSrc(tour.heroImage, tour.title, "HERO", "21/9");
    heroImg.alt = tour.heroAlt;
    heroImg.onerror = function () { this.onerror = null; this.src = placeholderSvg(tour.title, "HERO", "21/9"); };
    document.getElementById("hero-code").textContent = `${tour.code}　/　${tour.days} 天 ${tour.nights} 夜`;
    document.getElementById("hero-title").textContent = tour.title; document.getElementById("hero-subtitle").textContent = tour.subtitle;
    facts.innerHTML = [["出發", tour.departDate], ["返抵", tour.returnDate], ["三大基地", tour.bases], ["長途交通", tour.railway]].map(x => `<div class="fact"><dt class="eyebrow">${esc(x[0])}</dt><dd class="value">${esc(x[1])}</dd></div>`).join("");
    document.getElementById("overview-title").innerHTML = sectionTitle(tour.overview);

    function table(id, head, rows) { document.getElementById(id).innerHTML = `<thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>` }

    document.getElementById("itinerary-title").innerHTML = sectionTitle(tour.itineraryIntro);
    document.getElementById("days").innerHTML = tour.itinerary.map(day => {
      const gallery = day.gallery ?? (day.image ? [{ src: day.image, caption: day.title }] : []), cover = gallery[0], rest = gallery.slice(1);
      return `<li class="day">${cover ? `<figure class="day-cover"><img src="${imgSrc(cover.src, cover.caption, day.label, '21/9')}" alt="${esc(cover.caption)}" loading="lazy" onerror="this.onerror=null;this.src=placeholderSvg('${esc(cover.caption)}','${esc(day.label)}','21/9');"><div class="day-caption"><span class="day-no">${esc(day.label)}</span><span class="day-date">${esc(day.date)}</span><h3 class="day-title">${esc(day.title)}</h3><small>${esc(cover.caption)}</small></div></figure>` : `<div class="card-head"><span class="day-no">${esc(day.label)}</span> <span class="day-date">${esc(day.date)}</span><h3>${esc(day.title)}</h3></div>`}
 <div class="day-body"><div><div class="tags">${day.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div><ul class="items">${day.items.map(it => `<li>${esc(it)}</li>`).join("")}</ul><dl class="meta"><div><b>交通</b>${esc(day.transport)}</div><div><b>住宿</b>${esc(day.hotel)}</div></dl></div>${rest.length ? `<div class="day-gallery">${rest.map(im => `<figure><img src="${imgSrc(im.src, im.caption, day.label, '4/3')}" alt="${esc(im.caption)}" loading="lazy" onerror="this.onerror=null;this.src=placeholderSvg('${esc(im.caption)}','${esc(day.label)}','4/3');"><figcaption>${esc(im.caption)}</figcaption></figure>`).join("")}</div>` : ""}</div></li>`
    }).join("");
    notes.innerHTML = tour.notes.map(n => `<li>${esc(n)}</li>`).join("");
    document.getElementById("contact-title").textContent = tour.contact.title; document.getElementById("contact-text").textContent = tour.contact.text;
    document.getElementById("contact-info").innerHTML = [["電話", tour.contact.phone], ["Email", tour.contact.email], ["LINE", tour.contact.lineId]].map(x => `<div><small>${x[0]}</small><strong>${esc(x[1])}</strong></div>`).join("");
    document.getElementById("footer-left").textContent = `${tour.brand}　|　${tour.title}`; document.getElementById("footer-right").textContent = `${tour.departDate} － ${tour.returnDate}`;
